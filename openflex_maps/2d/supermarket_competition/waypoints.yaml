# 商超赛预设导航航点 (真实尺寸 6x8m, 原点左下角)
# 坐标系: x向右[0,6], y向上[0,8], yaw弧度(+x=0, +y=pi/2, -x=pi)
# 用途: 逐点下发验证窄通道精准停位，不依赖规划器自由发挥
#
# 场地布局:
#   通道1 x[0.05,1.5] 中线x=0.775  (货架A左面 x=1.5)
#   货架A x[1.5,2.3]  长面朝通道1(左)和通道2(右)
#   通道2 x[2.3,3.7] 中线x=3.00   <<< 极限工况: 1.4m宽,车两侧各0.25m
#   货架B x[3.7,4.5]  长面朝通道2(左)和通道3(右)
#   通道3 x[4.5,5.9] 中线x=5.20
#   货架纵向 y[6.04,7.90] (两块93cm拼接)
#   交付台 x[0.5,1.7] y[0.6,1.4] / 补货台 x[4.3,5.5] y[0.6,1.4]

meta:
  map: supermarket_competition
  resolution: 0.05
  robot_footprint: [0.92, 0.90]   # 与nav2_params一致
  aisle_min_width: 1.40
  clearance_per_side: 0.25        # 中央通道居中时单侧余量

# 起点 / 结束判定区 (下方开放区中央, 远离台子)
home:
  start:   {x: 3.00, y: 0.60, yaw: 1.5708}   # 面向货架区(+y)
  finish:  {x: 3.00, y: 0.60, yaw: 1.5708}

# 通道入口 (从起点先到通道口再进, 保证以直线中线姿态进窄道)
aisle_entries:
  aisle1_entry: {x: 0.775, y: 5.20, yaw: 1.5708}
  aisle2_entry: {x: 3.000, y: 5.20, yaw: 1.5708}   # 极限通道入口
  aisle3_entry: {x: 5.200, y: 5.20, yaw: 1.5708}

# 货架 approach pose: 车停通道中线, yaw朝向货架面
# 命名: <货架>_<面><纵向段>  面: L=左面 R=右面
shelf_approaches:
  # ---- 货架A ----
  # A左面(x=1.5) 朝通道1, 车在x=0.775 面向+x(yaw=0)
  A_L_seg1: {x: 0.775, y: 6.50, yaw: 0.0}
  A_L_seg2: {x: 0.775, y: 7.30, yaw: 0.0}
  # A右面(x=2.3) 朝通道2, 车在x=3.00 面向-x(yaw=pi)
  A_R_seg1: {x: 3.000, y: 6.50, yaw: 3.1416}
  A_R_seg2: {x: 3.000, y: 7.30, yaw: 3.1416}
  # ---- 货架B ----
  # B左面(x=3.7) 朝通道2, 车在x=3.00 面向+x(yaw=0)
  B_L_seg1: {x: 3.000, y: 6.50, yaw: 0.0}
  B_L_seg2: {x: 3.000, y: 7.30, yaw: 0.0}
  # B右面(x=4.5) 朝通道3, 车在x=5.20 面向-x(yaw=pi)
  B_R_seg1: {x: 5.200, y: 6.50, yaw: 3.1416}
  B_R_seg2: {x: 5.200, y: 7.30, yaw: 3.1416}

# 台子 approach (面向台子取放)
station_approaches:
  delivery:  {x: 1.10, y: 2.10, yaw: -1.5708}   # 交付台北侧,面向-y
  restock:   {x: 4.90, y: 2.10, yaw: -1.5708}   # 补货台北侧,面向-y

# 底盘验证巡游序列: 覆盖三通道+极限通道往返, 逐点下发看能否精准停正
validation_tour:
  - start
  - aisle2_entry      # 进极限通道
  - A_R_seg1          # 极限通道内停位1 (车距货架A右面0.25m)
  - A_R_seg2          # 极限通道内停位2
  - B_L_seg1          # 掉头面向货架B (原地±180需收敛)
  - B_L_seg2
  - aisle2_entry      # 退出极限通道
  - aisle1_entry
  - A_L_seg1
  - A_L_seg2
  - aisle3_entry
  - B_R_seg1
  - B_R_seg2
  - finish
