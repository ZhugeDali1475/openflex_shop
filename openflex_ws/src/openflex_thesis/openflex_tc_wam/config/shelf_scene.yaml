# Calibrate all poses in the same global frame used by ObjectMemory before
# setting calibrated=true. Until then the MoveIt evaluator will not emit a
# physical TC-WAM result.
calibrated: false
frame_id: map
collision_objects:
  - id: shelf_back
    shape: box
    dimensions: [1.20, 0.04, 1.80]  # CALIBRATE
    position: [0.0, 0.0, 0.90]      # CALIBRATE in map
    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - id: shelf_board_target_level
    shape: box
    dimensions: [1.20, 0.45, 0.04]  # CALIBRATE
    position: [0.0, 0.0, 0.70]      # CALIBRATE in map
    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - id: shelf_left_wall
    shape: box
    dimensions: [0.04, 0.45, 1.80]  # CALIBRATE
    position: [0.0, 0.0, 0.90]      # CALIBRATE in map
    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - id: shelf_right_wall
    shape: box
    dimensions: [0.04, 0.45, 1.80]  # CALIBRATE
    position: [0.0, 0.0, 0.90]      # CALIBRATE in map
    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
