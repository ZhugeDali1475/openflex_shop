velocity_arbiter:
  ros__parameters:
    nav_input_topic: /thesis/nav_cmd_vel
    act_input_topic: /thesis/act_cmd_vel
    recovery_input_topic: /thesis/recovery_cmd_vel
    output_topic: /thesis/cmd_vel_selected
    measured_velocity_topic: /swerve_drive_controller/odom
    affordance_topic: /thesis/tc_wam/state
    memory_topic: /thesis/object_memory
    set_mode_service: /thesis/set_control_mode
    input_timeout_sec: 0.20
    measured_timeout_sec: 0.25
    memory_stream_timeout_sec: 0.25
    stop_confirm_sec: 0.50
    stopped_linear_mps: 0.02
    stopped_angular_rps: 0.03
