    base_frame: base_link
    require_physical_affordance: true
    stream_timeout_sec: 0.50
    measured_timeout_sec: 0.25
    ready_confirm_sec: 0.40
    ready_linear_mps: 0.03
    ready_angular_rps: 0.04
    default_timeout_sec: 30.0

moveit_grasp_executor:
  ros__parameters:
    action_name: /thesis/execute_moveit_grasp
    move_group_action: /move_action
    ik_service: /compute_ik
    state_validity_service: /check_state_validity
    apply_planning_scene_service: /apply_planning_scene
    left_gripper_action: /left_gripper_controller/gripper_cmd
    right_gripper_action: /right_gripper_controller/gripper_cmd
    joint_state_topic: /joint_states
    grasp_status_topic: /thesis/grasp_status
    memory_topic: /thesis/object_memory
    control_mode_topic: /thesis/control_mode
    measured_velocity_topic: /swerve_drive_controller/odom
    base_frame: base_link
    joint_state_timeout_sec: 0.50
    measured_timeout_sec: 0.25
    memory_timeout_sec: 0.50
