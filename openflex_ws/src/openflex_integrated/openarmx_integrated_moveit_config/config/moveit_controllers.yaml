# OpenArmX MoveIt controller manager configuration. The implementation keeps
# the existing action endpoints for lift/arms/grippers and adds a multi-DOF
# base_planar_joint handle backed by /navigate_to_pose.

moveit_controller_manager: openarmx_integrated_moveit_config/OpenArmXControllerManager
moveit_manage_controllers: false

# The command bridge owns execution completion. MoveIt does not add a separate
# start-state or expected-duration rejection to trajectories sent through it.
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 8.0
  allowed_start_tolerance: 0.0
  execution_duration_monitoring: false

openarmx_controller_manager:
  controller_names:
    - lift_joint_controller
    - left_joint_trajectory_controller
    - right_joint_trajectory_controller
    - left_gripper_controller
    - right_gripper_controller
    - base_navigation_controller

  lift_joint_controller:
    type: FollowJointTrajectory
    joints:
      - lift_joint
    action_ns: follow_joint_trajectory
    default: true
  left_joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - openarmx_left_joint1
      - openarmx_left_joint2
      - openarmx_left_joint3
      - openarmx_left_joint4
      - openarmx_left_joint5
      - openarmx_left_joint6
      - openarmx_left_joint7
    action_ns: follow_joint_trajectory
    default: true
  right_joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - openarmx_right_joint1
      - openarmx_right_joint2
      - openarmx_right_joint3
      - openarmx_right_joint4
      - openarmx_right_joint5
      - openarmx_right_joint6
      - openarmx_right_joint7
    action_ns: follow_joint_trajectory
    default: true
  left_gripper_controller:
    type: GripperCommand
    joints:
      - openarmx_left_finger_joint1
    action_ns: gripper_cmd
    default: true
  right_gripper_controller:
    type: GripperCommand
    joints:
      - openarmx_right_finger_joint1
    action_ns: gripper_cmd
    default: true
  base_navigation_controller:
    type: NavigateToPose
    joints:
      - base_planar_joint
    action_ns: /navigate_to_pose
    default: true
