# Joint limits / scaling for MoveIt planning.
# Defaults are downscaled for safety; raise the scaling factors (<= 1.0) for speed.

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  # Lift column (prismatic, Z axis). Range taken from lift_slide_module.urdf.xacro.
  lift_joint:
    has_position_limits: true
    min_position: -0.650
    max_position: 0.300
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: false
    max_acceleration: 0.0

