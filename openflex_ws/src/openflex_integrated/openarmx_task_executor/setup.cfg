[develop]
script_dir=$base/lib/openarmx_task_executor
[install]
install_scripts=$base/lib/openarmx_task_executor

[flake8]
max-line-length = 100

[tool:pytest]
# The host has an unrelated anyio plugin that requires a newer system pytest.
# This package has no async-anyio tests, so keep its ROS test environment isolated.
addopts = -p no:anyio
