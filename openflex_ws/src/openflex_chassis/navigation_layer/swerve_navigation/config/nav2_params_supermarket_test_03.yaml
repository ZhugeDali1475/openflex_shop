# supermarket_test_03 chassis-navigation benchmark profile.
#
# Goals: repeatable ICP localization, holonomic waypoint tracking, dynamic
# obstacle handling, and <= 5 cm / <= 0.05 rad final-pose validation.  This is
# an unloaded transport-pose baseline. Re-measure and enlarge the footprint
# before testing baskets, carried goods, or extended arms.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_safe
    bt_loop_duration: 20
    # BT child actions and costmap services can take more than 20 ms to
    # acknowledge while the full-body stack is under startup/load pressure.
    # A 1 s acknowledgement window avoids aborting a healthy first goal; the
    # navigation actions retain their own execution and safety timeouts.
    default_server_timeout: 1000
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_distance_controller_bt_node
      - nav2_single_trigger_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_wait_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.35
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.04
      # Allow a short safe wait for a crossing robot or deliberately placed box.
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05

    FollowPath:
      plugin: "nmpc_controller::NmpcController"
      horizon_steps: 20
      horizon_time: 2.0
      Q_px: 65.0
      Q_py: 65.0
      Q_theta: 8.0
      Q_vx: 1.5
      Q_vy: 0.8
      Q_omega: 2.0
      R_ax: 0.08
      R_ay: 0.10
      R_alpha: 0.12
      Q_e_px: 95.0
      Q_e_py: 95.0
      Q_e_theta: 14.0
      Q_e_vx: 3.0
      Q_e_vy: 3.0
      Q_e_omega: 2.5
      costmap_weight: 60.0
      # Low-speed benchmark envelope: stable enough for payload tests later.
      vx_max: 0.30
      vx_min: 0.0
      vy_max: 0.20
      omega_max: 0.60
      ax_max: 0.50
      ay_max: 0.40
      alpha_max: 1.00
      transform_tolerance: 0.15
      desired_linear_vel: 0.20
      approach_velocity_scaling_dist: 0.90
      goal_heading_align_ratio: 1.0
      goal_heading_align_dist: 0.0
      start_heading_capture_dist: 0.80
      start_speed_min_scale: 0.35
      final_rotate_xy_tolerance: 0.05
      final_rotate_xy_release_tolerance: 0.12
      final_rotate_yaw_threshold: 0.07
      final_rotate_yaw_goal_tolerance: 0.04
      final_rotate_angular_vel: 0.20
      final_rotate_min_angular_vel: 0.06
      final_rotate_gain: 0.8
      final_position_settle_duration: 0.50
      final_position_approach_dist: 0.20
      final_position_approach_gain: 1.0
      final_position_approach_min_speed: 0.035
      final_position_approach_max_speed: 0.08
      terminal_deadband_dist: 0.30
      terminal_linear_deadband: 0.018
      terminal_angular_deadband: 0.02
      prune_search_distance: 4.0
      same_goal_replan_attach_dist: 0.18
      reference_heading_smoothing_gain: 0.15
      reference_omega_smoothing_gain: 0.20
      reference_omega_rate_limit_scale: 0.65
      curve_speed_reduction_gain: 0.75
      curve_speed_min_scale: 0.40
      curve_switch_yaw_rate_threshold: 0.30
      curve_switch_speed_scale: 0.18
      allow_lateral_tracking: true
      swerve_native_mode: true
      visualize: true
      # Dynamic-obstacle detours remain available; the BT itself never backs up.
      local_astar_enabled: true
      local_astar_cost_threshold: 0.40
      local_astar_reconnect_dist: 1.5
      local_astar_obstacle_lookahead: 2.5
      local_astar_inflation_cost: 0.35
      local_astar_smooth_iterations: 3
      local_astar_smooth_weight: 0.3
      rotate_to_heading_threshold: 0.35
      initial_in_place_alignment_enabled: true
      rotate_to_heading_release_threshold: 0.12
      rotate_to_heading_angular_vel: 0.35
      rotate_to_heading_min_angular_vel: 0.10
      rotate_to_heading_gain: 1.0
      rotate_to_heading_goal_reset_dist: 0.25
      rotate_to_heading_goal_reset_angle: 0.35
      lio_odom_topic: /fastlio2/lio_odom
      lio_odom_timeout: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 12.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.15
      footprint_padding: 0.02
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[-0.46,-0.45],[-0.46,0.45],[0.46,0.45],[0.46,-0.45]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false
        combination_method: 1
        observation_sources: scan pointcloud_lidar
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_min_range: 0.45
          obstacle_max_range: 8.00
          raytrace_min_range: 0.40
          raytrace_max_range: 10.00
        pointcloud_lidar:
          topic: /livox/body_cloud_nav2
          data_type: "PointCloud2"
          # Low returns are already represented by /scan.
          min_obstacle_height: 0.40
          max_obstacle_height: 1.80
          clearing: true
          marking: true
          obstacle_min_range: 0.45
          obstacle_max_range: 8.00
          raytrace_min_range: 0.40
          raytrace_max_range: 10.00
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.15
      footprint_padding: 0.02
      footprint: "[[-0.46,-0.45],[-0.46,0.45],[0.46,0.45],[0.46,-0.45]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: scan pointcloud_lidar
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_min_range: 0.45
          obstacle_max_range: 10.00
          raytrace_min_range: 0.40
          raytrace_max_range: 12.00
        pointcloud_lidar:
          topic: /livox/body_cloud_nav2
          data_type: "PointCloud2"
          min_obstacle_height: 0.40
          max_obstacle_height: 1.80
          clearing: true
          marking: true
          obstacle_min_range: 0.45
          obstacle_max_range: 10.00
          raytrace_min_range: 0.40
          raytrace_max_range: 12.00
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.05
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 10.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
      refinement_num: 3

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.15
    use_sim_time: false
    simulate_ahead_time: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.20, 0.60]
    min_velocity: [0.00, -0.20, -0.60]
    max_accel: [0.50, 0.40, 1.00]
    max_decel: [-0.60, -0.50, -1.20]
    odom_topic: "/odom_safe"
    odom_duration: 0.1
    deadband_velocity: [0.012, 0.012, 0.015]
    velocity_timeout: 0.5
