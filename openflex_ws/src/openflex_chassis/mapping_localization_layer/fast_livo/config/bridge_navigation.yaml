/**:
  ros__parameters:
    raw_odom_topic: raw/odom
    raw_world_cloud_topic: raw/world_cloud
    lio_odom_topic: lio_odom
    body_cloud_topic: body_cloud
    world_cloud_topic: world_cloud
    path_topic: lio_path
    world_frame: odom
    odom_frame: odom
    body_frame: base_link
    # odom -> base_link is owned by safe_odom_mux in navigation mode.  Publishing
    # it here as well makes TF alternate between raw LIO and the guarded output.
    publish_tf: false
    publish_map_odom: false
    freeze_map_odom_when_static: true
    static_linear_thresh: 0.01
    static_angular_thresh: 0.02
    static_hold_time: 0.2
    # Keep only a short timestamped pose history for pairing each cloud.
    pose_history_size: 100
    cloud_pose_max_skew_sec: 0.03
    r_ib: [0.0, -1.0,  0.0,
           0.86603, 0.0, -0.5,
           0.5,  0.0,  0.86603]
    t_ib: [0.0, -0.18249, -0.24392]
    body_cloud_self_filter_enabled: true
    body_cloud_self_filter_min_x: -0.45
    body_cloud_self_filter_max_x: 0.45
    body_cloud_self_filter_min_y: -0.35
    body_cloud_self_filter_max_y: 0.35
    body_cloud_self_filter_min_z: -0.25
    body_cloud_self_filter_max_z: 0.35
    # base_link frame boxes: the complete transport-pose column, lift column,
    # and the wider lifted upper body. Filtering only the chassis below 0.45 m
    # leaks repeatable arm/lift returns around y=0.22 m and z=0.7-1.0 m.
    body_cloud_self_filter_boxes: [
      -0.45, 0.45, -0.44, 0.44, -0.30, 1.05,
      -0.22, 0.22, -0.22, 0.22, 0.35, 1.20,
      -0.65, 0.65, -0.55, 0.55, 1.05, 1.85
    ]
